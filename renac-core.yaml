    name: "${renac_name} ${e_load_power_total}"
    address: 11113
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

# ---------------------------------------------------------------------------
# Derived values (computed on the ESP, not read from Modbus)
# ---------------------------------------------------------------------------

  # Total AC power across all three phases.
  - platform: template
    name: "${renac_name} ${e_inverter_power_total}"
    id: renac_inverter_total
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      if (isnan(id(renac_inverter_r).state) || isnan(id(renac_inverter_s).state)
          || isnan(id(renac_inverter_t).state)) return NAN;
      return id(renac_inverter_r).state + id(renac_inverter_s).state
           + id(renac_inverter_t).state;
    update_interval: ${renac_update_interval}

  # Split charge/discharge into separate always-positive sensors.
  # Home Assistant's Energy dashboard needs these as two distinct sources.
  - platform: template
    name: "${renac_name} ${e_battery_charge_power}"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      if (isnan(id(renac_battery_power).state)) return NAN;
      return id(renac_battery_power).state > 0 ? id(renac_battery_power).state : 0;
    update_interval: ${renac_update_interval}

  - platform: template
    name: "${renac_name} ${e_battery_discharge_power}"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      if (isnan(id(renac_battery_power).state)) return NAN;
      return id(renac_battery_power).state < 0 ? -id(renac_battery_power).state : 0;
    update_interval: ${renac_update_interval}

  # Same split for the grid meter.
  - platform: template
    name: "${renac_name} ${e_grid_import_power}"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      if (isnan(id(renac_meter_total).state)) return NAN;
      return id(renac_meter_total).state > 0 ? id(renac_meter_total).state : 0;
    update_interval: ${renac_update_interval}

  - platform: template
    name: "${renac_name} ${e_grid_export_power}"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      if (isnan(id(renac_meter_total).state)) return NAN;
      return id(renac_meter_total).state < 0 ? -id(renac_meter_total).state : 0;
    update_interval: ${renac_update_interval}

  # Cell voltage spread — a good early warning of pack imbalance.
  # Healthy packs sit under ~50 mV; a rising trend means a cell is drifting.
  - platform: template
    name: "${renac_name} ${e_cell_voltage_delta}"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(renac_cell_max).state) || isnan(id(renac_cell_min).state))
        return NAN;
      return id(renac_cell_max).state - id(renac_cell_min).state;
    update_interval: ${renac_update_interval}

  # Conversion losses: AC drawn minus DC stored. Typically 5-15%.
  # A sustained rise can indicate a developing fault.
  - platform: template
    name: "${renac_name} ${e_conversion_loss}"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(renac_inverter_total).state)
          || isnan(id(renac_battery_power).state)) return NAN;
      return -id(renac_inverter_total).state - id(renac_battery_power).state;
    update_interval: ${renac_update_interval}

# ---------------------------------------------------------------------------
# Status registers
# Values seen in normal operation: inverter 0x0002, BMS 0x0001,
# meter 0x0001, battery 0x0101, alarm 0x0000.
# Full bit meanings are not yet documented — contributions welcome.
# ---------------------------------------------------------------------------
text_sensor:
  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_battery_status}"
    address: 11040
    register_type: holding
    force_new_range: true
    raw_encode: HEXBYTES
    register_count: 1
    response_size: 2
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_inverter_state}"
    address: 11057
    register_type: holding
    force_new_range: true
    raw_encode: HEXBYTES
    register_count: 1
    response_size: 2
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_bms_state}"
    address: 11058
    register_type: holding
    raw_encode: HEXBYTES
    register_count: 1
    response_size: 2
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_meter_state}"
    address: 11059
    register_type: holding
    raw_encode: HEXBYTES
    register_count: 1
    response_size: 2
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_alarm}"
    address: 11060
    register_type: holding
    raw_encode: HEXBYTES
    register_count: 1
    response_size: 2
    entity_category: diagnostic
