# ============================================================================
# Renac hybrid inverter — ESPHome Modbus RTU package (CORE)
# ============================================================================
#
# Do not include this file directly — include a language file instead:
#
#     packages:
#       renac: !include lang/en.yaml     # or lang/pl.yaml, lang/de.yaml ...
#
# The language file supplies the entity-name substitutions and pulls this
# core in as a package. Register addresses, scaling and logic live here and
# here only; translations never touch them.
#
# Tested on: Renac N3-HV (three-phase hybrid, AC-coupled retrofit)
# Register map: holding 11000-11143
#   (base map from github.com/Yety/Renacci, extended and verified 2026-08)
#
# HARDWARE
#   Any ESP8266/ESP32 + RS485 transceiver (MAX485 / MAX3485 / auto-direction).
#   Inverter COM port: pin 3 = 485_A, pin 4 = 485_B (RJ45).
#   9600 baud, 8N1. Default slave address 1.
#   With MAX485 you MUST set flow_control_pin (DE+RE tied together).
#   Auto-direction modules: remove the flow_control_pin line.
#
# SIGN CONVENTIONS (verified against a live system)
#   inverter AC power  : negative = importing from grid (charging)
#                        positive = exporting to grid (discharging)
#   battery power      : positive = charging, negative = discharging
#   meter power        : positive = importing, negative = exporting
#
# NOTES
#   - All values are 16-bit SIGNED big-endian. U_WORD shows ~65000 instead
#     of negative numbers.
#   - PV registers (11000-11005) read zero on AC-coupled retrofits.
#   - Registers below 11000 and above 11143 return exception 2.
#   - Registers 11006-11015 and 11061-11075 read zero; omitted here.
#   - No cumulative energy registers exist. Use a Riemann sum integration
#     in Home Assistant to get kWh.
#
# LICENCE: public domain / CC0
# ============================================================================

substitutions:
  renac_name: "Renac"
  renac_address: "1"
  renac_update_interval: "15s"
  renac_tx_pin: "TX"
  renac_rx_pin: "RX"
  renac_flow_control_pin: "4"

uart:
  id: uart_renac
  tx_pin: ${renac_tx_pin}
  rx_pin: ${renac_rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_renac
  uart_id: uart_renac
  # Remove the next line if your RS485 module handles direction automatically.
  flow_control_pin: ${renac_flow_control_pin}
  send_wait_time: 250ms

modbus_controller:
  - id: renac
    address: ${renac_address}
    modbus_id: modbus_renac
    update_interval: ${renac_update_interval}
    command_throttle: 100ms

sensor:

# ---------------------------------------------------------------------------
# PV input (DC-coupled installs only — reads zero on AC retrofits)
# ---------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_pv1_voltage}"
    address: 11000
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.1]

  - platform: modbus_controller
    modbus_controller_id: renac
    name: "${renac_name} ${e_pv1_current}"
    address: 11001
