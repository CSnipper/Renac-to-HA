  e_cell_voltage_delta: "cell voltage delta"

  # --- Grid ---
  e_grid_voltage_r: "grid voltage R"
  e_grid_voltage_s: "grid voltage S"
  e_grid_voltage_t: "grid voltage T"
  e_grid_frequency_r: "grid frequency R"
  e_grid_frequency_s: "grid frequency S"
  e_grid_frequency_t: "grid frequency T"
