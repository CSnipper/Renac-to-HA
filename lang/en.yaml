# ============================================================================
# Renac hybrid inverter — English entity names
# ============================================================================
#
# Include THIS file, not renac-core.yaml:
#
#     packages:
#       renac: !include lang/en.yaml
#
# To add a language: copy this file, translate the values on the right,
# leave the keys and the packages block untouched. Nothing else changes.
#
# ============================================================================

substitutions:

  # --- PV input ---
  e_pv1_voltage: "PV1 voltage"
  e_pv1_current: "PV1 current"
  e_pv1_power: "PV1 power"
  e_pv2_voltage: "PV2 voltage"
  e_pv2_current: "PV2 current"
  e_pv2_power: "PV2 power"

  # --- Temperatures ---
  e_internal_temperature: "internal temperature"
  e_charger_temperature: "charger temperature"
  e_boost_temperature: "boost temperature"
  e_inverter_temperature: "inverter temperature"

  # --- Battery / BMS ---
  e_battery_voltage: "battery voltage"
  e_battery_current: "battery current"
  e_battery_power: "battery power"
  e_bms_voltage: "BMS voltage"
  e_bms_current: "BMS current"
  e_bms_temperature: "BMS temperature"
  e_battery_soc: "battery SOC"
  e_battery_soh: "battery SOH"
  e_battery_cycles: "battery cycles"
  e_battery_capacity: "battery capacity"
  e_battery_charge_power: "battery charge power"
  e_battery_discharge_power: "battery discharge power"
