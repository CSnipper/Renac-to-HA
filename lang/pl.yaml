# ============================================================================
# Renac hybrid inverter — Polish / polskie entity names
# ============================================================================
#
# Include THIS file, not renac-core.yaml:
#
#     packages:
#       renac: !include lang/pl.yaml
#
# To add a language: copy this file, translate the values on the right,
# leave the keys and the packages block untouched. Nothing else changes.
#
# Tłumacz tylko wartości po prawej stronie.
# Klucze (e_...) i sekcja packages muszą zostać bez zmian.
#
# ============================================================================

substitutions:

